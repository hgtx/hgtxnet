---
layout: default
---

{% unless page.hide_title %}
<section class="intro">

	<div class="wrap">

		<h1>{{ page.title }}</h1>
		{% if page.subtitle != blank %}
		<p>{{ page.subtitle }}</p>
		{% endif %}

	</div>

</section>
{% endunless %}

<section class="single">

	<div class="wrap">

		{{ page.content }}

	</div>

</section>
